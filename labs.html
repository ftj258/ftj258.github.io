<script src="cases.js"></script>
<script>
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text) e.textContent=text; return e; }
  function link(href, text, external){ var a=el('a','project-link',text); a.href=href; if(external){ a.target='_blank'; a.rel='noopener'; } return a; }
  var list=document.getElementById('case-list');
  window.CASES.slice().sort(function(a,b){ return a.number-b.number; }).forEach(function(c){
    var card=el('div','case'), head=el('div','case-head'), body=el('div','case-body');
    head.appendChild(el('span','case-id','CASE '+c.number+' · '+c.kind.toUpperCase()));
    head.appendChild(el('span','status closed','Closed'));
    body.appendChild(el('p','case-role',c.title));
    body.appendChild(el('p','case-org',c.details));
    var ul=el('ul'); ul.appendChild(el('li',null,c.summary)); body.appendChild(ul);
    var links=el('div','case-links');
    links.appendChild(link(c.report,'Read the case report →',true));
    if(c.post) links.appendChild(link('blog/'+c.post.page,'Read the blog post →',false));
    body.appendChild(links);
    card.appendChild(head); card.appendChild(body); list.appendChild(card);
  });
</script>
</body>
